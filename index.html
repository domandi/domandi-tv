<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>domandi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #080808;
      --surface: #111111;
      --surface-hover: #161616;
      --border: rgba(255,255,255,0.07);
      --border-hover: rgba(255,255,255,0.14);
      --text-primary: #f5f5f5;
      --text-secondary: rgba(255,255,255,0.4);
      --accent: #ffffff;
      --radius: 18px;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      padding: 48px 20px;
      position: relative;
      overflow-x: hidden;
    }

    @media (max-width: 480px) {
      body {
        padding: 40px 16px;
        justify-content: flex-start;
        padding-top: 60px;
      }
      .card {
        max-width: 100%;
      }
    }

    /* Subtle radial glow behind profile */
    body::before {
      content: '';
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.035) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* Profile section */
    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-bottom: 44px;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
    }

    .avatar-wrap {
      position: relative;
      width: 110px;
      height: 110px;
    }

    .avatar-wrap::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      background: conic-gradient(from 180deg, rgba(255,255,255,0.18), rgba(255,255,255,0.04), rgba(255,255,255,0.18));
      z-index: -1;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: #1a1a1a;
    }

    .name {
      font-family: 'Nunito', sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.2px;
      color: var(--text-primary);
    }

    /* Buttons */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 18px 22px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-decoration: none;
      color: var(--text-primary);
      cursor: pointer;
      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1),
        box-shadow 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      opacity: 0;
      transform: translateY(20px);
      position: relative;
      overflow: hidden;
    }

    .link-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .link-btn:hover::before {
      opacity: 1;
    }

    .link-btn:nth-child(1) { animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.3s forwards; }
    .link-btn:nth-child(2) { animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.42s forwards; }
    .link-btn:nth-child(3) { animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.54s forwards; }

    .link-btn:hover {
      background: var(--surface-hover);
      border-color: var(--border-hover);
      transform: translateY(-1px) scale(1.005);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    .link-btn:active {
      transform: scale(0.98);
      box-shadow: none;
    }

    .btn-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .btn-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: rgba(255,255,255,0.06);
    }

    .btn-icon svg {
      width: 18px;
      height: 18px;
      fill: var(--text-primary);
    }

    .btn-label {
      font-family: 'Nunito', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .btn-sub {
      font-size: 11.5px;
      color: var(--text-secondary);
      font-weight: 400;
      margin-top: 1px;
    }

    .btn-arrow {
      opacity: 0.3;
      transition: opacity 0.2s, transform 0.2s;
      flex-shrink: 0;
    }

    .link-btn:hover .btn-arrow {
      opacity: 0.7;
      transform: translateX(3px);
    }

    /* Support button special treatment */
    .link-btn.support {
      background: rgba(255,255,255,0.04);
      border-color: rgba(255,255,255,0.1);
    }

    .link-btn.support .btn-icon {
      background: rgba(255,255,255,0.09);
    }

    /* Footer */
    .footer {
      margin-top: 40px;
      font-size: 11px;
      color: rgba(255,255,255,0.18);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.75s forwards;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="profile">
      <div class="avatar-wrap">
        <img class="avatar" src="selfie-circle.png" alt="domandi" />
      </div>
      <div class="name">domandi</div>
    </div>

    <div class="links">

      <!-- YouTube -->
      <a class="link-btn" href="http://youtube.com/@domandi?sub_confirmation=1" target="_blank" rel="noopener">
        <div class="btn-left">
          <div class="btn-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
          </div>
          <div>
            <div class="btn-label">YouTube</div>
            <div class="btn-sub">Subscribe for more</div>
          </div>
        </div>
        <svg class="btn-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>

      <!-- Twitch -->
      <a class="link-btn" href="https://www.twitch.tv/domanditv" target="_blank" rel="noopener">
        <div class="btn-left">
          <div class="btn-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/>
            </svg>
          </div>
          <div>
            <div class="btn-label">Twitch</div>
          </div>
        </div>
        <svg class="btn-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>

      <!-- Support -->
      <a class="link-btn support" href="https://streamlabs.com/domandi/tip" target="_blank" rel="noopener">
        <div class="btn-left">
          <div class="btn-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 21.593c-5.63-5.539-11-10.297-11-14.402 0-3.791 3.068-5.191 5.281-5.191 1.312 0 4.151.501 5.719 4.457 1.59-3.968 4.464-4.447 5.726-4.447 2.54 0 5.274 1.621 5.274 5.181 0 4.069-5.136 8.625-11 14.402z"/>
            </svg>
          </div>
          <div>
            <div class="btn-label">Support</div>
            <div class="btn-sub">Leave a tip</div>
          </div>
        </div>
        <svg class="btn-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>

    </div>

    <div class="footer">domandi &middot; 2026</div>
  </div>

</body>
</html>
